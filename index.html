<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnmaker Tactics</title>
    <style>
      :root {
        --bg: #090d1a;
        --panel: rgba(18, 25, 47, 0.9);
        --line: rgba(151, 168, 255, 0.18);
        --text: #edf3ff;
        --muted: #a7b5d1;
        --accent: #8b5cf6;
        --accent-2: #22c1ff;
        --good: #65d69b;
        --bad: #ff6b75;
        --warning: #f5d66f;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, rgba(139, 92, 246, 0.18), transparent 28%), linear-gradient(160deg, #070b13 0%, #0f172a 35%, #111827 100%);
        color: var(--text);
      }

      body {
        padding: 24px;
      }

      button, input, select, textarea {
        font: inherit;
      }

      .app-shell {
        max-width: 1500px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 16px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-2);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }

      h1, h2, h3, p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(420px, 1.2fr) 420px;
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.38);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-weight: 600;
        color: var(--muted);
      }

      input, textarea, select {
        width: 100%;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        outline: none;
      }

      input:focus, textarea:focus, select:focus {
        border-color: rgba(34, 193, 255, 0.7);
        box-shadow: 0 0 0 3px rgba(34, 193, 255, 0.15);
      }

      .icon-row {
        display: flex;
        gap: 10px;
      }

      .icon-row input {
        max-width: 110px;
        text-align: center;
        font-size: 1.5rem;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .secondary {
        background: rgba(139, 92, 246, 0.2);
        color: var(--text);
        border: 1px solid rgba(139, 92, 246, 0.35);
      }

      .ghost {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      .mini {
        padding: 8px 12px;
        min-width: 90px;
      }

      .small {
        padding: 8px 10px;
        font-size: 0.76rem;
      } 
      .main-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(34, 193, 255, 0.12);
        border: 1px solid rgba(34, 193, 255, 0.25);
        color: var(--accent-2);
        font-weight: 700;
        font-size: 0.8rem;
      }

      .turn-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .turn-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(148, 163, 184, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        gap: 12px;
      }

      .turn-item.active {
        border-color: rgba(34, 193, 255, 0.8);
        background: rgba(34, 193, 255, 0.07);
      }

      .turn-item.used { opacity: 0.6; }

      .turn-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .turn-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        border: 1px solid rgba(255,255,255,0.18);
      }

      .turn-name { font-weight: 700; }
      .turn-status { font-size: 0.76rem; color: var(--muted); }

      .checkbox-row {
        display: flex;
        flex-direction: row !important;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-weight: 600;
      }

      .checkbox-row input { width: auto; accent-color: var(--accent-2); }

      .entity-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 760px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .entity-card {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 12px;
        background: rgba(148, 163, 184, 0.06);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
      }

      .entity-card.active {
        border-color: rgba(34, 193, 255, 0.8);
        box-shadow: inset 0 0 0 1px rgba(34, 193, 255, 0.35);
      }

      .entity-card.used { opacity: 0.7; }

      .entity-pic {
        width: 78px;
        height: 78px;
        border-radius: 18px;
        background-size: cover;
        background-position: center;
        object-fit: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        border: 1px solid rgba(255,255,255,0.18);
      }

      .entity-photo-link {
        display: block;
        height: 78px;
      }

      .photo-credit {
        color: var(--muted);
        font-size: 0.72rem;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .log-avatar {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 10px;
      }

      .turn-avatar-photo {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.18);
      }

      .turn-controls-disabled {
        opacity: 0.5;
      }

      .entity-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .entity-topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .entity-name {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
      }

      .entity-kind {
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.18);
        border: 1px solid rgba(139, 92, 246, 0.35);
        font-size: 0.7rem;
        color: #ddd5ff;
      }

      .entity-description {
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.4;
        margin: 0;
      }

      .entity-badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mini-badge {
        font-size: 0.72rem;
        padding: 4px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }

      .log-panel {
        margin-top: 20px;
      }

      .log-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .log-item {
        background: rgba(148, 163, 184, 0.05);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        line-height: 1.5;
      }

      .log-item strong { color: var(--accent-2); }
      .crit { font-weight: 700; }
      .success { color: var(--good); }
      .fail { color: var(--bad); }

      .empty-state {
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 18px;
        text-align: center;
      }

      form[hidden], [hidden] { display: none !important; }

      .creation-choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .object-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .object-card {
        background: rgba(148, 163, 184, 0.06);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .object-card h3 { margin-bottom: 6px; }
      .object-card p { color: var(--muted); font-size: 0.86rem; margin: 8px 0 0; }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .entity-list {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fantasy GM Sandbox</p>
          <h1>Turnmaker Tactics</h1>
        </div>
        <button id="newRoundBtn" class="secondary">New Round</button>
      </header>

      <main class="layout">
        <aside class="panel">
          <h2>End-of-Turn Creation</h2>
          <p id="creationPrompt">Finish your action to unlock your required creation choice.</p>
          <div id="creationChoices" class="creation-choices" hidden>
            <button type="button" id="chooseCreature" class="secondary">Make a Creature</button>
            <button type="button" id="chooseObject" class="secondary">Make an Object</button>
          </div>
          <form id="createForm" hidden>
            <label>
              Creature name
              <input id="beingName" type="text" placeholder="Astra the Fox" required />
            </label>

            <label>
              Creature kind
              <input id="beingType" type="text" placeholder="Dragon, Bee, Robot, Spirit, etc." required />
            </label>

            <label>
              Relationship status
              <select id="beingRelationship">
                <option value="unspecified">Not specified</option>
                <option value="single">Single</option>
                <option value="partnered">Has a partner</option>
                <option value="not-interested">Not looking for romance</option>
              </select>
            </label>

            <label>
              Icon
              <div class="icon-row">
                <input id="beingIcon" type="text" maxlength="2" value="✨" aria-label="Icon" />
                <button type="button" id="randomIconBtn" class="mini">Random</button>
              </div>
            </label>

            <label>
              Description
              <textarea id="beingDescription" rows="3" placeholder="Brave, clever, and a little dramatic..."></textarea>
            </label>

            <button type="submit" class="primary">Create Creature and End Turn</button>
          </form>
          <form id="objectForm" hidden>
            <label>
              Object name
              <input id="objectName" type="text" placeholder="The Moonlit Market" required />
            </label>

            <label>
              Object type
              <input id="objectType" type="text" placeholder="Shop, knife, potion, building..." required />
            </label>

            <label>
              Object size
              <select id="objectSize">
                <option value="small">Small item</option>
                <option value="large">Large construction (takes 1–5 turns)</option>
              </select>
            </label>

            <label class="checkbox-row">
              <input id="objectInInventory" type="checkbox" />
              <span>Add this small item to my inventory</span>
            </label>

            <label>
              Icon
              <input id="objectIcon" type="text" maxlength="2" value="📦" aria-label="Object icon" />
            </label>

            <label>
              Description
              <textarea id="objectDescription" rows="3" placeholder="A mysterious shop that appears at dusk..."></textarea>
            </label>

            <button type="submit" class="primary">Create Object and End Turn</button>
          </form>
        </aside>

        <section class="main-panel">
          <div class="panel">
            <div class="panel-header">
              <h2>Turn Order</h2>
              <span id="roundBadge" class="badge">Round 1</span>
            </div>
            <div id="turnOrder" class="turn-list"></div>
          </div>

          <div class="panel">
            <h2>Take an Action</h2>
            <form id="actionForm">
              <p id="turnPrompt">Your turn</p>

              <label>
                What do they do? Type a creature's name to talk to or attack it.
                <input id="actionText" type="text" placeholder="Explore the ruins, or attack the shadow beast..." required />
              </label>

              <label class="checkbox-row">
                <input id="needsRoll" type="checkbox" />
                <span>Roll a d20 for this action (attacks always roll: 1–7 self-damage, 8–15 hit, 16–20 critical)</span>
              </label>

              <button type="submit" class="primary">Resolve Turn</button>
            </form>
          </div>
        </section>

        <aside class="panel">
          <h2>Created Beings</h2>
          <div id="entityList" class="entity-list"></div>
          <h2>Created Objects</h2>
          <div id="objectList" class="object-list"></div>
          <h2>Inventory</h2>
          <div id="inventoryList" class="object-list"></div>
        </aside>
      </main>

      <section class="panel log-panel">
        <div class="panel-header">
          <h2>Action Log</h2>
          <button id="clearLogBtn" class="ghost small">Clear Log</button>
        </div>
        <ul id="logList" class="log-list"></ul>
      </section>
    </div>

    <script>
      const DEFAULT_ICONS = ["✨", "🦊", "🐉", "🦁", "🦄", "🐺", "🧙", "🛡️", "🌙", "⚡", "🌟", "🧿", "🌋", "🧲", "🐲", "🦅", "🌞", "🪐", "🧪", "🎭", "🤖", "🌿", "🧊", "🔥", "💎", "🐝", "🧑"];

      const state = {
        round: 1,
        entities: [],
        objects: [],
        inventory: [],
        currentIndex: 0,
        log: [],
        relationships: {},
        pendingCreationActorId: null,
        pendingCreationType: null
      };

      let aiTurnTimer = null;

      const elements = {
        createForm: document.getElementById("createForm"),
        objectForm: document.getElementById("objectForm"),
        creationPrompt: document.getElementById("creationPrompt"),
        creationChoices: document.getElementById("creationChoices"),
        chooseCreature: document.getElementById("chooseCreature"),
        chooseObject: document.getElementById("chooseObject"),
        beingName: document.getElementById("beingName"),
        beingType: document.getElementById("beingType"),
        beingRelationship: document.getElementById("beingRelationship"),
        beingIcon: document.getElementById("beingIcon"),
        beingDescription: document.getElementById("beingDescription"),
        objectName: document.getElementById("objectName"),
        objectType: document.getElementById("objectType"),
        objectSize: document.getElementById("objectSize"),
        objectInInventory: document.getElementById("objectInInventory"),
        objectIcon: document.getElementById("objectIcon"),
        objectDescription: document.getElementById("objectDescription"),
        randomIconBtn: document.getElementById("randomIconBtn"),
        actionForm: document.getElementById("actionForm"),
        actionText: document.getElementById("actionText"),
        needsRoll: document.getElementById("needsRoll"),
        entityList: document.getElementById("entityList"),
        objectList: document.getElementById("objectList"),
        inventoryList: document.getElementById("inventoryList"),
        turnOrder: document.getElementById("turnOrder"),
        roundBadge: document.getElementById("roundBadge"),
        logList: document.getElementById("logList"),
        newRoundBtn: document.getElementById("newRoundBtn"),
        clearLogBtn: document.getElementById("clearLogBtn"),
        turnPrompt: document.getElementById("turnPrompt")
      };

      function randomFrom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function makeId() {
        return (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : `entity-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function startingHitPoints(name, type) {
        const description = `${name} ${type}`.toLowerCase();

        if (/\b(ants?|bees?|beetles?|butterfly|butterflies|caterpillars?|cockroaches?|crickets?|dragonfly|dragonflies|flies|fly|grasshoppers?|hornets?|insects?|ladybugs?|mantis|mantises|mosquito|mosquitoes|moths?|termites?|wasps?)\b/.test(description)) {
          return 5;
        }
        if (/\b(gods?|goddesses|deity|deities)\b/.test(description)) {
          return 1000;
        }
        if (/\b(humans?|person|people)\b/.test(description)) {
          return 50;
        }
        if (/\b(wolves|wolf|lions?|tigers?|bears?|hyenas?|leopards?|panthers?|crocodiles?|alligators?|sharks?|cougars?|cheetahs?|lynxes|boars?)\b/.test(description)) {
          return 100;
        }
        if (/\b(monsters?|dragons?|demons?|devils?|ogres?|trolls?|giants?|beasts?)\b/.test(description)) {
          return Math.floor(Math.random() * 201) + 100;
        }
        return 100;
      }

      function generateAvatarData(entity) {
        const palette = [
          ["#8b5cf6", "#22c1ff"],
          ["#f59e0b", "#ef4444"],
          ["#10b981", "#22d3ee"],
          ["#f472b6", "#ec4899"],
          ["#a78bfa", "#f97316"],
          ["#38bdf8", "#60a5fa"],
          ["#34d399", "#a3e635"],
          ["#fca5a5", "#fb7185"]
        ];

        const [a, b] = randomFrom(palette);
        const name = (entity.name || entity.type || "Being").slice(0, 10);
        const icon = entity.icon || "✨";

        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
            <defs>
              <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="${a}" />
                <stop offset="100%" stop-color="${b}" />
              </linearGradient>
            </defs>
            <rect width="220" height="220" rx="40" fill="url(#g)"/>
            <circle cx="110" cy="75" r="44" fill="rgba(255,255,255,0.2)"/>
            <text x="110" y="120" font-size="56" text-anchor="middle" dominant-baseline="middle" fill="white">${icon}</text>
            <text x="110" y="180" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Segoe UI, sans-serif">${name}</text>
          </svg>
        `;

        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        })[character]);
      }

      function addLog(message, entity = null) {
        state.log.unshift({ id: Date.now() + Math.random(), message, image: entity ? entity.image : "", icon: entity ? entity.icon : "", entityId: entity ? entity.id : "" });
        if (state.log.length > 25) {
          state.log.pop();
        }
      }

      function relationshipKey(firstId, secondId) {
        return [firstId, secondId].sort().join(":");
      }

      function getRapport(firstId, secondId) {
        return state.relationships[relationshipKey(firstId, secondId)] || 0;
      }

      function changeRapport(firstId, secondId, amount) {
        const key = relationshipKey(firstId, secondId);
        state.relationships[key] = Math.max(-10, Math.min(10, getRapport(firstId, secondId) + amount));
      }

      function rapportLabel(score) {
        if (score >= 5) return "Friendly";
        if (score <= -5) return "Strained";
        return "Neutral";
      }

      function advanceTurn() {
        if (!state.entities.length) {
          state.currentIndex = 0;
          return;
        }

        const player = state.entities.find((entity) => entity.isPlayer);
        if (player && player.hp <= 0) {
          state.currentIndex = state.entities.indexOf(player);
          return;
        }

        while (true) {
          let found = false;
          for (let offset = 1; offset <= state.entities.length; offset += 1) {
            const index = (state.currentIndex + offset) % state.entities.length;
            if (!state.entities[index].turnUsed) {
              state.currentIndex = index;
              found = true;
              break;
            }
          }

          if (!found) {
            state.round += 1;
            state.entities.forEach((entity) => {
              entity.turnUsed = false;
            });
            state.currentIndex = 0;
            addLog(`A new round begins. Round ${state.round} has started.`);
          }

          const activeEntity = state.entities[state.currentIndex];
          if (activeEntity.busyTurns > 0) {
            activeEntity.busyTurns -= 1;
            activeEntity.turnUsed = true;
            addLog(`<strong>${escapeHtml(activeEntity.name)}</strong> is busy constructing and skips this turn. ${activeEntity.busyTurns} construction turn${activeEntity.busyTurns === 1 ? "" : "s"} remain.`);
            if (activeEntity.busyTurns === 0 && activeEntity.construction) {
              state.objects.push(activeEntity.construction);
              addLog(`<strong>${escapeHtml(activeEntity.construction.name)}</strong> is finished and ready.`);
              activeEntity.construction = null;
            }
            continue;
          }

          return;
        }
      }

      function ensureTurnPointer() {
        if (state.pendingCreationActorId) return;

        if (!state.entities.length) {
          state.currentIndex = 0;
          return;
        }

        if (state.currentIndex >= state.entities.length) {
          state.currentIndex = 0;
        }

        const player = state.entities.find((entity) => entity.isPlayer);
        if (player && player.hp <= 0) {
          state.currentIndex = state.entities.indexOf(player);
          return;
        }

        if (state.entities[state.currentIndex] && state.entities[state.currentIndex].turnUsed) {
          advanceTurn();
        }
      }

      function renderTurnOrder() {
        elements.turnOrder.innerHTML = "";

        if (!state.entities.length) {
          elements.turnOrder.innerHTML = '<div class="empty-state">No beings yet. Create one to start the story.</div>';
          elements.roundBadge.textContent = `Round ${state.round}`;
          return;
        }

        state.entities.forEach((entity, index) => {
          const item = document.createElement("div");
          item.className = `turn-item ${index === state.currentIndex ? "active" : ""} ${entity.turnUsed ? "used" : ""}`;

          const avatar = document.createElement("div");
          avatar.className = "turn-avatar";
          const avatarImage = document.createElement("img");
          avatarImage.className = "turn-avatar-photo";
          avatarImage.src = entity.image;
          avatarImage.alt = `${entity.name} picture`;
          avatar.appendChild(avatarImage);

          const info = document.createElement("div");
          info.className = "turn-left";

          const text = document.createElement("div");
          const title = document.createElement("div");
          title.className = "turn-name";
          title.textContent = entity.name;

          const status = document.createElement("div");
          status.className = "turn-status";
          status.textContent = entity.busyTurns > 0
            ? `Busy: ${entity.busyTurns} turn${entity.busyTurns === 1 ? "" : "s"} remaining`
            : index === state.currentIndex && !entity.turnUsed ? "Current turn" : entity.turnUsed ? "Turn used" : "Waiting";

          text.appendChild(title);
          text.appendChild(status);
          info.appendChild(avatar);
          info.appendChild(text);

          const badge = document.createElement("div");
          badge.className = "mini-badge";
          badge.textContent = entity.busyTurns > 0 ? `Busy · ${entity.busyTurns}` : entity.turnUsed ? "Used" : "Ready";

          item.appendChild(info);
          item.appendChild(badge);
          elements.turnOrder.appendChild(item);
        });

        elements.roundBadge.textContent = `Round ${state.round}`;
      }

      function renderEntityList() {
        elements.entityList.innerHTML = "";

        if (!state.entities.length) {
          elements.entityList.innerHTML = '<div class="empty-state">No beings on the field yet.</div>';
          return;
        }

        state.entities.forEach((entity, index) => {
          const card = document.createElement("article");
          card.className = `entity-card ${index === state.currentIndex ? "active" : ""} ${entity.turnUsed ? "used" : ""}`;

          const pic = document.createElement("img");
          pic.className = "entity-pic";
          pic.src = entity.image;
          pic.alt = `${entity.name}, a ${entity.type}`;

          const meta = document.createElement("div");
          meta.className = "entity-meta";

          const lineup = document.createElement("div");
          lineup.className = "entity-topline";

          const name = document.createElement("h3");
          name.className = "entity-name";
          name.textContent = entity.name;

          const kind = document.createElement("span");
          kind.className = "entity-kind";
          kind.textContent = entity.type;

          const desc = document.createElement("p");
          desc.className = "entity-description";
          desc.textContent = entity.description || "A curious being with endless potential.";

          if (entity.imageSource) {
            const credit = document.createElement("a");
            credit.className = "photo-credit";
            credit.href = entity.imageSource;
            credit.target = "_blank";
            credit.rel = "noopener noreferrer";
            credit.textContent = "Photo source: Wikimedia Commons";
            meta.appendChild(credit);
          }

          const badges = document.createElement("div");
          badges.className = "entity-badges";

          const statusBadge = document.createElement("span");
          statusBadge.className = "mini-badge";
          statusBadge.textContent = entity.turnUsed ? "Turn used" : "Ready";

          const roundBadge = document.createElement("span");
          roundBadge.className = "mini-badge";
          roundBadge.textContent = `Round ${state.round}`;

          badges.appendChild(statusBadge);
          badges.appendChild(roundBadge);

          if (entity.busyTurns > 0) {
            const constructionBadge = document.createElement("span");
            constructionBadge.className = "mini-badge";
            constructionBadge.textContent = `Constructing: ${entity.busyTurns} turns left`;
            badges.appendChild(constructionBadge);
          }

          const hitPointsBadge = document.createElement("span");
          hitPointsBadge.className = "mini-badge";
          hitPointsBadge.textContent = `${entity.hp}/${entity.maxHp} HP`;
          badges.appendChild(hitPointsBadge);

          if (!entity.isPlayer) {
            const relationshipBadge = document.createElement("span");
            relationshipBadge.className = "mini-badge";
            relationshipBadge.textContent = entity.relationshipStatus === "partnered"
              ? "Has a partner"
              : entity.relationshipStatus === "not-interested"
                ? "Not seeking romance"
                : entity.relationshipStatus === "single"
                  ? "Single"
                  : "Relationship unknown";
            badges.appendChild(relationshipBadge);

            const player = state.entities.find((being) => being.isPlayer);
            if (player) {
              const rapportBadge = document.createElement("span");
              rapportBadge.className = "mini-badge";
              rapportBadge.textContent = `With you: ${rapportLabel(getRapport(entity.id, player.id))}`;
              badges.appendChild(rapportBadge);
            }
          }

          lineup.appendChild(name);
          lineup.appendChild(kind);
          meta.appendChild(lineup);
          meta.appendChild(desc);
          meta.appendChild(badges);

          if (entity.imageSource) {
            const photoLink = document.createElement("a");
            photoLink.className = "entity-photo-link";
            photoLink.href = entity.imageSource;
            photoLink.target = "_blank";
            photoLink.rel = "noopener noreferrer";
            photoLink.setAttribute("aria-label", `Open ${entity.name}'s photo source`);
            photoLink.appendChild(pic);
            card.appendChild(photoLink);
          } else {
            card.appendChild(pic);
          }
          card.appendChild(meta);
          elements.entityList.appendChild(card);
        });

        const activeEntity = state.entities[state.currentIndex];
        const playerTurn = Boolean(activeEntity && activeEntity.isPlayer && activeEntity.hp > 0 && !activeEntity.turnUsed);
        const waitingForCreation = Boolean(activeEntity && state.pendingCreationActorId === activeEntity.id);
        elements.turnPrompt.textContent = waitingForCreation
          ? "Choose a creature or object to finish your turn."
          : activeEntity && activeEntity.isPlayer && activeEntity.hp <= 0
            ? "You have been defeated."
          : playerTurn ? "Your turn" : activeEntity ? `${activeEntity.name} is taking a turn...` : "No active turn";
        elements.actionForm.classList.toggle("turn-controls-disabled", !playerTurn);
        Array.from(elements.actionForm.elements).forEach((control) => {
          control.disabled = !playerTurn;
        });
        elements.newRoundBtn.disabled = Boolean(state.pendingCreationActorId || state.entities.some((entity) => entity.busyTurns > 0) || (activeEntity && activeEntity.isPlayer && activeEntity.hp <= 0));
        renderCreationPanel();
      }

      function renderCreationPanel() {
        const actor = state.entities.find((entity) => entity.id === state.pendingCreationActorId);
        const playerChoosing = Boolean(actor && actor.isPlayer);
        const choosingCreature = state.pendingCreationType === "creature";
        const choosingObject = state.pendingCreationType === "object";

        elements.creationPrompt.textContent = playerChoosing
          ? `${actor.name}, choose what to create to finish your turn.`
          : state.entities.some((entity) => entity.isPlayer && entity.hp <= 0)
            ? "You have been defeated."
          : "Finish your action to unlock your required creation choice.";
        elements.creationChoices.hidden = !playerChoosing || Boolean(state.pendingCreationType);
        elements.createForm.hidden = !playerChoosing || !choosingCreature;
        elements.objectForm.hidden = !playerChoosing || !choosingObject;
      }

      function renderObjectList() {
        elements.objectList.innerHTML = "";
        if (!state.objects.length) {
          elements.objectList.innerHTML = '<div class="empty-state">No objects created yet.</div>';
          return;
        }

        state.objects.forEach((object) => {
          const card = document.createElement("article");
          card.className = "object-card";
          const name = document.createElement("h3");
          name.textContent = `${object.icon} ${object.name}`;
          const type = document.createElement("span");
          type.className = "mini-badge";
          type.textContent = object.type;
          card.appendChild(name);
          card.appendChild(type);
          if (object.size === "large") {
            const construction = document.createElement("span");
            construction.className = "mini-badge";
            construction.textContent = "Large construction";
            card.appendChild(construction);
          } else if (state.inventory.includes(object.id)) {
            const inventoryBadge = document.createElement("span");
            inventoryBadge.className = "mini-badge";
            inventoryBadge.textContent = "In inventory";
            card.appendChild(inventoryBadge);
          }
          const description = document.createElement("p");
          description.textContent = object.description || "A newly created object.";
          card.appendChild(description);
          elements.objectList.appendChild(card);
        });
      }

      function renderInventory() {
        elements.inventoryList.innerHTML = "";
        const items = state.inventory
          .map((objectId) => state.objects.find((object) => object.id === objectId))
          .filter(Boolean);
        if (!items.length) {
          elements.inventoryList.innerHTML = '<div class="empty-state">Your inventory is empty.</div>';
          return;
        }

        items.forEach((object) => {
          const card = document.createElement("article");
          card.className = "object-card";
          const name = document.createElement("h3");
          name.textContent = `${object.icon} ${object.name}`;
          const type = document.createElement("span");
          type.className = "mini-badge";
          type.textContent = object.type;
          card.appendChild(name);
          card.appendChild(type);
          elements.inventoryList.appendChild(card);
        });
      }

      function renderLog() {
        elements.logList.innerHTML = "";

        if (!state.log.length) {
          elements.logList.innerHTML = '<li class="empty-state">No actions yet. The story is waiting.</li>';
          return;
        }

        state.log.forEach((entry) => {
          const item = document.createElement("li");
          item.className = "log-item";
          if (entry.image) {
            const image = document.createElement("img");
            image.className = "log-avatar";
            image.src = entry.image;
            image.alt = `${entry.icon || "Being"} turn picture`;
            if (entry.imageSource) {
              const imageLink = document.createElement("a");
              imageLink.href = entry.imageSource;
              imageLink.target = "_blank";
              imageLink.rel = "noopener noreferrer";
              imageLink.setAttribute("aria-label", "Open turn photo source");
              imageLink.appendChild(image);
              item.appendChild(imageLink);
            } else {
              item.appendChild(image);
            }
          }
          const message = document.createElement("span");
          message.innerHTML = entry.message;
          item.appendChild(message);
          elements.logList.appendChild(item);
        });
      }

      function render() {
        ensureTurnPointer();
        renderTurnOrder();
        renderEntityList();
        renderObjectList();
        renderInventory();
        renderLog();
      }

      async function findCreatureImage(entity) {
        const search = `${entity.type} filetype:bitmap`;
        const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(search)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=256&format=json&origin=*`;

        try {
          const response = await fetch(url);
          if (!response.ok) return null;
          const data = await response.json();
          const page = Object.values(data.query?.pages || {})[0];
          const info = page?.imageinfo?.[0];
          return info?.thumburl || info?.url
            ? { url: info.thumburl || info.url, source: info.descriptionurl }
            : null;
        } catch (error) {
          return null;
        }
      }

      function addEntity(entityInput, turnUsed = false) {
        const hp = startingHitPoints(entityInput.name, entityInput.type);
        const entity = {
          id: makeId(),
          name: entityInput.name.trim(),
          type: entityInput.type.trim(),
          relationshipStatus: entityInput.relationshipStatus || "unspecified",
          description: entityInput.description.trim() || "A bold and unforgettable being.",
          icon: entityInput.icon.trim() || "✨",
          hp,
          maxHp: hp,
          image: "",
          imageSource: "",
          hostileTo: [],
          busyTurns: 0,
          construction: null,
          turnUsed,
          isPlayer: false
        };

        entity.image = generateAvatarData(entity);
        state.entities.push(entity);

        if (state.entities.length === 1) {
          state.currentIndex = 0;
        } else {
          state.currentIndex = Math.min(state.currentIndex, state.entities.length - 1);
        }

        addLog(`<strong>${escapeHtml(entity.name)}</strong> enters the story as a ${escapeHtml(entity.type)}.`, entity);

        findCreatureImage(entity).then((photo) => {
          if (!photo || !state.entities.some((being) => being.id === entity.id)) return;
          entity.image = photo.url;
          entity.imageSource = photo.source || "";
          state.log.forEach((entry) => {
            if (entry.entityId === entity.id) {
              entry.image = photo.url;
              entry.imageSource = photo.source || "";
            }
          });
          render();
        });
      }

      function initializePlayer() {
        const player = {
          id: makeId(),
          name: "You",
          type: "Player",
          description: "You are the main character. You are the only one at the start.",
          icon: "🧑",
          hp: 50,
          maxHp: 50,
          image: "",
          imageSource: "",
          hostileTo: [],
          busyTurns: 0,
          construction: null,
          turnUsed: false,
          isPlayer: true
        };

        player.image = generateAvatarData(player);
        state.entities.push(player);
        state.currentIndex = 0;
      }

      function createBeing(event) {
        event.preventDefault();
        if (state.pendingCreationType !== "creature" || !state.pendingCreationActorId) return;

        const name = elements.beingName.value.trim();
        const type = elements.beingType.value.trim();
        const icon = elements.beingIcon.value.trim() || "✨";
        const description = elements.beingDescription.value.trim();

        if (!name || !type) {
          elements.beingName.focus();
          return;
        }

        const actorId = state.pendingCreationActorId;
        addEntity({ name, type, icon, description, relationshipStatus: elements.beingRelationship.value }, true);

        elements.createForm.reset();
        elements.beingType.value = "Dragon";
        elements.beingRelationship.value = "unspecified";
        elements.beingIcon.value = "✨";
        elements.beingDescription.value = "";
        elements.beingName.focus();
        completeTurnCreation(actorId);
      }

      function createObject(event) {
        event.preventDefault();
        if (state.pendingCreationType !== "object" || !state.pendingCreationActorId) return;

        const name = elements.objectName.value.trim();
        const type = elements.objectType.value.trim();
        if (!name || !type) {
          elements.objectName.focus();
          return;
        }

        const actorId = state.pendingCreationActorId;
        const object = {
          id: makeId(),
          name,
          type,
          icon: elements.objectIcon.value.trim() || "📦",
          description: elements.objectDescription.value.trim(),
          size: elements.objectSize.value
        };
        const builder = state.entities.find((entity) => entity.id === actorId);
        if (object.size === "small") state.objects.push(object);
        if (object.size === "small" && elements.objectInInventory.checked) {
          state.inventory.push(object.id);
        }
        const constructionTurns = object.size === "large" ? Math.floor(Math.random() * 5) + 1 : 0;
        if (constructionTurns) {
          if (builder) {
            builder.busyTurns = constructionTurns;
            builder.construction = object;
          }
        }
        addLog(object.size === "large"
          ? `<strong>${escapeHtml(name)}</strong> begins construction (${escapeHtml(type)}). It will take ${constructionTurns} turn${constructionTurns === 1 ? "" : "s"}.`
          : `<strong>${escapeHtml(name)}</strong> is created as an object (${escapeHtml(type)}).${state.inventory.includes(object.id) ? " It is added to your inventory." : ""}`);
        elements.objectForm.reset();
        elements.objectSize.value = "small";
        elements.objectInInventory.checked = false;
        elements.objectInInventory.disabled = false;
        elements.objectIcon.value = "📦";
        completeTurnCreation(actorId);
      }

      function completeTurnCreation(actorId) {
        if (state.pendingCreationActorId !== actorId) return;
        state.pendingCreationActorId = null;
        state.pendingCreationType = null;
        advanceTurn();
        render();
        scheduleAiTurn();
      }

      function beginTurnCreation(actor) {
        if (actor.isPlayer) {
          state.pendingCreationActorId = actor.id;
          state.pendingCreationType = null;
          render();
          return;
        }

        const createCreature = Math.random() < 0.5;
        if (createCreature) {
          const types = ["Fox", "Dragon", "Bee", "Spirit", "Robot"];
          const type = randomFrom(types);
          addEntity({
            name: `New ${type}`,
            type,
            icon: randomFrom(DEFAULT_ICONS),
            description: `Created by ${actor.name} at the end of their turn.`,
            relationshipStatus: "unspecified"
          }, true);
        } else {
          const objects = [
            { name: "Traveling Shop", type: "Shop", icon: "🏪" },
            { name: "Iron Knife", type: "Knife", icon: "🔪" },
            { name: "Healing Potion", type: "Potion", icon: "🧪" },
            { name: "Old Watchtower", type: "Building", icon: "🏰" }
          ];
          const object = randomFrom(objects);
          state.objects.push({
            id: makeId(),
            ...object,
            description: `Created by ${actor.name} at the end of their turn.`
          });
          addLog(`<strong>${escapeHtml(object.name)}</strong> is created as an object (${escapeHtml(object.type)}).`);
        }

        advanceTurn();
        render();
        scheduleAiTurn();
      }

      function rollD20() {
        return Math.floor(Math.random() * 20) + 1;
      }

      function socialIntent(actionText) {
        const text = actionText.toLowerCase();
        if (!/\b(talk|speak|say|ask|greet|hello|hi|hey|compliment|flirt|date|hand|shake|hold|chat)\b/.test(text)) return null;

        return {
          romantic: /\b(flirt|date|romantic|kiss|love)\b|\bhold\b.{0,20}\bhand\b|\bhand\b.{0,20}\bhold\b/.test(text),
          handshake: /\b(handshake|shake hands)\b/.test(text),
          holdingHand: /\bhold\b.{0,20}\bhand\b|\bhand\b.{0,20}\bhold\b/.test(text),
          greeting: /\b(hi|hello|hey|greet)\b/.test(text),
          compliment: /\b(compliment|beautiful|handsome|pretty|cute|look nice)\b/.test(text),
          question: /\b(ask|question|how are|what do|where|why|who)\b/.test(text)
        };
      }

      function findActionTarget(actionText) {
        const actionWords = actionText.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
        const matches = state.entities.filter((entity) => {
          if (entity.isPlayer || entity.hp <= 0) return false;
          const nameWords = entity.name.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
          return nameWords.length > 0 && actionWords.some((_, start) =>
            nameWords.every((word, offset) => actionWords[start + offset] === word)
          );
        });
        return matches.sort((first, second) => second.name.length - first.name.length)[0] || null;
      }

      function isAttackAction(actionText) {
        return /\b(attack|attacks|hit|hits|strike|strikes|kill|kills|fight|fights)\b/i.test(actionText);
      }

      function applyDamage(target, damage, reason) {
        target.hp = Math.max(0, target.hp - damage);
        addLog(`<strong>${escapeHtml(target.name)}</strong> ${reason} and takes ${damage} damage (${target.hp}/${target.maxHp} HP).`, target);

        if (target.hp === 0) {
          if (target.isPlayer) {
            addLog("<strong>You have been defeated.</strong>");
          } else {
            removeEntity(target.id, "was killed", true, false);
          }
        }
      }

      function resolveAttack(attacker, target) {
        if (!target.hostileTo.includes(attacker.id)) target.hostileTo.push(attacker.id);
        const roll = rollD20();

        if (roll <= 7) {
          const damage = Math.max(1, Math.ceil(attacker.maxHp * 0.1));
          addLog(`<strong>${escapeHtml(attacker.name)}</strong> rolls ${roll}/20 and misses ${escapeHtml(target.name)}, hurting themself instead.`);
          applyDamage(attacker, damage, "hurts themself");
          return;
        }

        const critical = roll >= 16;
        const baseDamage = Math.max(1, Math.ceil(target.maxHp * 0.1));
        const damage = baseDamage * (critical ? 3 : 1);
        addLog(`<strong>${escapeHtml(attacker.name)}</strong> rolls ${roll}/20 and ${critical ? "lands a critical hit on" : "hits"} <strong>${escapeHtml(target.name)}</strong> for ${damage} damage.`);
        applyDamage(target, damage, critical ? "is critically hit" : "is hit");
      }

      function socialReply(intent, accepted, actionText, target, approachRoll, approachThreshold, requestRoll, hasPartner, isNotInterested) {
        const targetName = escapeHtml(target.name);
        if (approachRoll < approachThreshold) {
          return randomFrom([
            `${targetName} gives a brief, reserved answer and does not continue the conversation.`,
            `${targetName} says, "Not right now," and turns back to what they were doing.`,
            `${targetName} politely declines to engage just now.`
          ]);
        }

        if (!accepted) {
          if (intent.romantic && hasPartner && requestRoll < 15) {
            return randomFrom([
              `${targetName} steps back and says, "I have a partner, so no thanks."`,
              `${targetName} politely but firmly says, "I'm with someone."`,
              `${targetName} declines, explaining that they already have a partner.`
            ]);
          }
          if (intent.romantic && isNotInterested) {
            return randomFrom([
              `${targetName} says, "I'm not looking for romance, but thanks for asking."`,
              `${targetName} kindly makes it clear they don't want a romantic relationship.`,
              `${targetName} declines and asks to keep things friendly.`
            ]);
          }
          if (intent.holdingHand || intent.handshake) {
            return randomFrom([
              `${targetName} gently pulls their hand back: "I'd rather not, thanks."`,
              `${targetName} declines the gesture and gives you a little space.`,
              `${targetName} says, "I'm not comfortable with that."`
            ]);
          }
          if (intent.romantic) {
            return randomFrom([
              `${targetName} says, "Thanks, but I'm not interested."`,
              `${targetName} kindly makes it clear they don't want a romantic relationship.`,
              `${targetName} declines and asks to keep things friendly.`
            ]);
          }
          return randomFrom([
            `${targetName} answers briefly: "I'd rather not get into that."`,
            `${targetName} says, "Maybe another time," and changes the subject.`,
            `${targetName} gives a polite no and keeps some distance.`
          ]);
        }

        if (intent.handshake) {
          return randomFrom([`${targetName} smiles and shakes your hand.`, `${targetName} accepts the handshake warmly.`]);
        }
        if (intent.holdingHand) {
          return randomFrom([`${targetName} agrees and gently takes your hand.`, `${targetName} smiles and lets you hold their hand.`]);
        }
        if (intent.romantic) {
          return randomFrom([`${targetName} smiles: "I'd like that."`, `${targetName} agrees to spend time with you.`, `${targetName} responds warmly and says yes.`]);
        }
        if (intent.greeting) {
          return randomFrom([`"Hi! How are you?" ${targetName} replies.`, `"Hey, nice to see you," says ${targetName}.`, `${targetName} smiles and says hello back.`]);
        }
        if (intent.compliment) {
          return randomFrom([`"That's kind of you to say," ${targetName} replies.`, `${targetName} smiles: "Thank you, that's sweet."`, `"Thanks! You made my day," says ${targetName}.`]);
        }
        if (intent.question) {
          return randomFrom([`${targetName} answers your question and asks what you think.`, `${targetName} considers it, then gives you a thoughtful answer.`, `${targetName} replies with a detail about ${escapeHtml(target.type.toLowerCase())} life.`]);
        }
        return randomFrom([
          `"${escapeHtml(actionText)}? Tell me more," ${targetName} says.`,
          `${targetName} listens and replies with a related story of their own.`,
          `${targetName} smiles: "I'm glad you came over to talk."`
        ]);
      }

      function resolveSocialAction(actor, target, actionText, intent) {
        const approachRoll = rollD20();
        const requestRoll = rollD20();
        const hasPartner = target.relationshipStatus === "partnered";
        const isNotInterested = target.relationshipStatus === "not-interested";
        const rapport = getRapport(actor.id, target.id);
        const rapportModifier = Math.max(-3, Math.min(3, Math.trunc(rapport / 3)));
        const approachThreshold = 10 - rapportModifier;
        const requestThreshold = intent.romantic && hasPartner
          ? 15
          : intent.romantic && isNotInterested
            ? 21
            : 10 - rapportModifier;
        const willingToTalk = approachRoll >= approachThreshold;
        const acceptsRequest = requestRoll >= requestThreshold;
        const accepted = willingToTalk && acceptsRequest;

        changeRapport(actor.id, target.id, accepted ? (intent.romantic ? 2 : 1) : -1);

        const response = socialReply(intent, accepted, actionText, target, approachRoll, approachThreshold, requestRoll, hasPartner, isNotInterested);
        const firstCheck = `<strong>Approach roll:</strong> ${approachRoll}/20 (needs ${approachThreshold}+; ${willingToTalk ? "engages" : "does not engage"}).`;
        const secondCheck = `<strong>Request roll:</strong> ${requestRoll}/20 (needs ${requestThreshold}+; ${acceptsRequest ? "passes" : "does not pass"} the request check).`;
        addLog(`<strong>${escapeHtml(actor.name)}</strong> tries to ${escapeHtml(actionText)} with <strong>${escapeHtml(target.name)}</strong>. ${firstCheck} ${secondCheck} ${response}`, target);
      }

      function resolveAction(event) {
        event.preventDefault();
        if (state.pendingCreationActorId) return;

        if (!state.entities.length) {
          addLog("The story is empty. Create a being before taking an action.");
          render();
          return;
        }

        const actor = state.entities[state.currentIndex];

        if (!actor) {
          addLog("Choose a valid actor for the action.");
          render();
          return;
        }

        if (actor.turnUsed) {
          addLog(`<strong>${actor.name}</strong> already used their turn this round.`);
          render();
          return;
        }

        if (!actor.isPlayer) {
          return;
        }

        const actionText = elements.actionText.value.trim() || "takes a bold action";
        const requiresRoll = elements.needsRoll.checked;
        const target = findActionTarget(actionText);
        const intent = socialIntent(actionText);

        if (isAttackAction(actionText)) {
          if (!target) {
            addLog("To attack, type the name of a living creature that has been created.");
            render();
            return;
          }

          actor.turnUsed = true;
          resolveAttack(actor, target);
          elements.actionText.value = "";
          elements.needsRoll.checked = false;
          finishActorTurn(actor);
          return;
        }

        if (intent && target) {
          actor.turnUsed = true;
          resolveSocialAction(actor, target, actionText, intent);
          elements.actionText.value = "";
          elements.needsRoll.checked = false;
          finishActorTurn(actor);
          return;
        }

        if (intent && !target) {
          addLog("To talk to a creature, type the name of a living creature that has been created.");
          render();
          return;
        }

        let resultText = "Success (no roll).";

        if (requiresRoll) {
          const roll = rollD20();
          if (roll === 20) {
            resultText = `<span class="crit success">Critical success</span>! D20 roll: <strong>${roll}</strong>.`;
          } else if (roll === 1) {
            resultText = `<span class="crit fail">Critical fail</span>! D20 roll: <strong>${roll}</strong>.`;
          } else if (roll >= 12) {
            resultText = `Success! D20 roll: <strong>${roll}</strong>.`;
          } else {
            resultText = `Failure. D20 roll: <strong>${roll}</strong>.`;
          }
        }

        actor.turnUsed = true;
        addLog(`<strong>${escapeHtml(actor.name)}</strong> tries: “${escapeHtml(actionText)}”. ${resultText}`, actor);

        elements.actionText.value = "";
        elements.needsRoll.checked = false;

        finishActorTurn(actor);
      }

      function finishActorTurn(actor) {
        if (actor.hp <= 0) {
          if (actor.isPlayer) {
            render();
            return;
          }
          advanceTurn();
          render();
          scheduleAiTurn();
          return;
        }
        beginTurnCreation(actor);
      }

      function removeEntity(entityId, reason, logRemoval = true, refresh = true) {
        const index = state.entities.findIndex((entity) => entity.id === entityId && !entity.isPlayer);
        if (index < 0) return;

        const [removed] = state.entities.splice(index, 1);
        if (index < state.currentIndex) state.currentIndex -= 1;
        if (state.currentIndex >= state.entities.length) state.currentIndex = 0;

        if (logRemoval) addLog(`<strong>${escapeHtml(removed.name)}</strong> ${reason} and disappears from the field.`, removed);
        if (refresh) {
          render();
          scheduleAiTurn();
        }
      }

      function scheduleAiTurn() {
        if (aiTurnTimer) clearTimeout(aiTurnTimer);
        if (state.entities.some((entity) => entity.isPlayer && entity.hp <= 0)) return;
        const activeEntity = state.entities[state.currentIndex];
        if (activeEntity && !activeEntity.isPlayer && !activeEntity.turnUsed) {
          aiTurnTimer = setTimeout(playAiTurn, 700);
        }
      }

      function playAiTurn() {
        aiTurnTimer = null;
        const actor = state.entities[state.currentIndex];
        if (!actor || actor.isPlayer || actor.turnUsed) return;

        const hatedTarget = state.entities.find((entity) => actor.hostileTo.includes(entity.id) && entity.hp > 0);
        if (hatedTarget) {
          actor.turnUsed = true;
          addLog(`<strong>${escapeHtml(actor.name)}</strong> seeks revenge and attacks ${escapeHtml(hatedTarget.name)}.`);
          resolveAttack(actor, hatedTarget);
          finishActorTurn(actor);
          return;
        }

        const actions = [
          `explores the area around ${actor.type.toLowerCase()}`,
          `looks for something interesting nearby`,
          `practices a new ${actor.type.toLowerCase()} skill`,
          `rests and watches the surroundings`,
          `tries to make a new friend`
        ];
        const action = randomFrom(actions);
        const roll = rollD20();
        const outcome = roll === 20
          ? `<span class="crit success">Critical success</span>! D20 roll: <strong>20</strong>.`
          : roll === 1
            ? `<span class="crit fail">Critical fail</span>! D20 roll: <strong>1</strong>.`
            : roll >= 12
              ? `Success! D20 roll: <strong>${roll}</strong>.`
              : `The action does not go as planned. D20 roll: <strong>${roll}</strong>.`;

        actor.turnUsed = true;
        addLog(`<strong>${escapeHtml(actor.name)}</strong> takes an AI turn and ${escapeHtml(action)}. ${outcome}`, actor);
        beginTurnCreation(actor);
      }

      function resetRound() {
        if (state.pendingCreationActorId || state.entities.some((entity) => entity.busyTurns > 0) || state.entities.some((entity) => entity.isPlayer && entity.hp <= 0)) return;

        state.round += 1;
        state.entities.forEach((entity) => {
          entity.turnUsed = false;
        });
        state.currentIndex = 0;
        addLog("The round was reset. Everyone is ready to act again.");
        render();
        scheduleAiTurn();
      }

      function setupEvents() {
        elements.createForm.addEventListener("submit", createBeing);
        elements.objectForm.addEventListener("submit", createObject);
        elements.actionForm.addEventListener("submit", resolveAction);
        elements.chooseCreature.addEventListener("click", () => {
          if (!state.pendingCreationActorId) return;
          state.pendingCreationType = "creature";
          render();
        });
        elements.chooseObject.addEventListener("click", () => {
          if (!state.pendingCreationActorId) return;
          state.pendingCreationType = "object";
          render();
        });
        elements.randomIconBtn.addEventListener("click", () => {
          elements.beingIcon.value = randomFrom(DEFAULT_ICONS);
        });
        elements.objectSize.addEventListener("change", () => {
          elements.objectInInventory.disabled = elements.objectSize.value !== "small";
          if (elements.objectInInventory.disabled) elements.objectInInventory.checked = false;
        });
        const suggestObjectSize = () => {
          const isLargeConstruction = /\b(shop|house|building|castle|tower|fortress|mansion|temple|bridge|warehouse|barn|stable|ship|airship)\b/i
            .test(`${elements.objectName.value} ${elements.objectType.value}`);
          elements.objectSize.value = isLargeConstruction ? "large" : "small";
          elements.objectInInventory.disabled = isLargeConstruction;
          if (isLargeConstruction) elements.objectInInventory.checked = false;
        };
        elements.objectName.addEventListener("input", suggestObjectSize);
        elements.objectType.addEventListener("input", suggestObjectSize);
        elements.newRoundBtn.addEventListener("click", resetRound);
        elements.clearLogBtn.addEventListener("click", () => {
          state.log = [];
          render();
        });
      }

      function initialize() {
        initializePlayer();
        setupEvents();
        render();
        scheduleAiTurn();
      }

      initialize();
    </script>
  </body>
</html>
